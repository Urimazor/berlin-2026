document.getElementById('allOn').onclick=()=>setAll(true);document.getElementById('allOff').onclick=()=>setAll(false);
document.querySelectorAll('.dates button').forEach(b=>b.onclick=()=>selectDay(state.day===b.dataset.day?null:b.dataset.day));
document.getElementById('uitoggle').onclick=e=>{const f=document.body.classList.toggle('full');e.currentTarget.textContent=f?'הצג כלים':'הסתר כלים';e.currentTarget.setAttribute('aria-pressed',f);setTimeout(()=>map.invalidateSize(),50)};
document.querySelectorAll('[data-tog]').forEach(k=>{k.setAttribute('role','button');k.tabIndex=0;const t=()=>{if(!matchMedia('(max-width:820px)').matches)return;k.closest('.sec').classList.toggle('closed');setTimeout(()=>map.invalidateSize(),60)};k.onclick=t;k.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t()}}});
if(matchMedia('(max-width:820px)').matches)document.querySelectorAll('[data-col]').forEach(s=>s.classList.add('closed'));
renderTrip();renderLayers();renderDays();renderList();
</script>
<script>
window.ED=(function(){
const E={on:false,token:'',cur:null};
try{E.token=sessionStorage.getItem('bm_admin_tok')||''}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
function claims(){try{return JSON.parse(decodeURIComponent(escape(atob(E.token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))))}catch(e){return null}}
function valid(){const c=claims();return !!(c&&c.exp*1000>Date.now()+30000)}
function status(t,k){const s=$('edstat');s.textContent=t;s.className=k||''}
let T;E.save=function(){status('שומר…');clearTimeout(T);T=setTimeout(async()=>{if(!valid()){status('ההתחברות פגה, יש להתחבר מחדש','err');openLogin();return}try{const r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+E.token},body:JSON.stringify({v:1,points:P,days:DAYS,trip:TRIP})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);status('נשמר ופורסם ✓','ok')}catch(e){status('שגיאה בשמירה: '+e.message,'err')}},300)};
function refresh(){buildMarkers();renderTrip();renderLayers();renderDays();renderList();drawRoute(false)}
function enter(){E.on=true;document.body.classList.add('editing');$('adminbtn').textContent='סיום עריכה';status((claims()||{}).email||'');refresh()}
function exit(){E.on=false;document.body.classList.remove('editing');$('adminbtn').textContent='כניסת מנהל';map.closePopup();refresh()}
function logout(){exit();E.token='';try{sessionStorage.removeItem('bm_admin_tok')}catch(e){}try{google.accounts.id.disableAutoSelect()}catch(e){}}
async function check(){try{const r=await fetch('/api/auth',{headers:{Authorization:'Bearer '+E.token}});return r.ok}catch(e){return false}}
let gsi;function loadGsi(){return gsi||(gsi=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=ok;s.onerror=no;document.head.appendChild(s)}))}
async function openLogin(){const d=$('admdlg'),m=$('admmsg');d.style.display='grid';m.textContent='טוען…';$('gbtn').innerHTML='';
 try{const c=await (await fetch('/api/config',{cache:'no-store'})).json();if(!c.clientId){m.textContent='ההתחברות עם Google עדיין לא הוגדרה באתר.';return}
  await loadGsi();google.accounts.id.initialize({client_id:c.clientId,callback:async r=>{E.token=r.credential;m.textContent='בודק הרשאה…';if(await check()){try{sessionStorage.setItem('bm_admin_tok',E.token)}catch(e){}d.style.display='none';enter()}else{E.token='';m.textContent='לחשבון הזה אין הרשאת מנהל.'}}});
  m.textContent='התחברו עם חשבון Google של מנהל האפליקציה.';google.accounts.id.renderButton($('gbtn'),{theme:'outline',size:'large',text:'signin_with',locale:'he'})}catch(e){m.textContent='ממשק הניהול זמין רק באתר עצמו.'}}
E.open=openLogin;
$('adminbtn').onclick=async()=>{if(E.on){exit();return}if(valid()&&await check()){enter();return}openLogin()};
$('admclose').onclick=()=>{$('admdlg').style.display='none'};
$('logout').onclick=logout;
$('addpt').onclick=()=>{status('לחצו על המפה במקום הנקודה החדשה');$('map').classList.add('adding');map.once('click',e=>{$('map').classList.remove('adding');P.push(['sites','New place','נקודה חדשה','','',+e.latlng.lat.toFixed(6),+e.latlng.lng.toFixed(6),'','pt'+Date.now().toString(36),'']);if(!state.on.has('sites')){state.on.add('sites');groups.sites.addTo(map)}refresh();E.save();const m=markers.get(P.length-1);if(m)m.openPopup()})};
E.form=function(p){E.cur=p[8];const d=DAYS.find(x=>x.id===state.day);const inR=d&&d.stops.includes(p[8]);
 return '<div class="pe" dir="rtl"><label>שכבה<select id="pe-l">'+LAYERS.filter(l=>l.id!=='hoods').map(l=>'<option value="'+l.id+'"'+(l.id===p[0]?' selected':'')+'>'+l.name+'</option>').join('')+'</select></label><label>שם בעברית<input id="pe-he" value="'+esc(p[2])+'"></label><label>שם מקורי (לחיפוש בגוגל)<input id="pe-n" dir="ltr" value="'+esc(p[1])+'"></label><label>תיאור<textarea id="pe-d" rows="3">'+esc(p[3])+'</textarea></label><label>שכונה<input id="pe-a" dir="ltr" value="'+esc(p[4])+'"></label><label>קישור Google Maps<input id="pe-u" dir="ltr" placeholder="https://maps.app.goo.gl/…" value="'+esc(p[7])+'"></label><div class="pe-b"><button onclick="ED.savePt()">שמירה</button>'+(d?'<button onclick="ED.toRoute()">'+(inR?'הסרה ממסלול ':'הוספה למסלול ')+d.d+'</button>':'')+'<button class="del" onclick="ED.del()">מחיקת נקודה</button></div><div class="pe-h">כדי להזיז את הנקודה, גררו אותה על המפה.</div></div>'};
E.savePt=function(){const q=P[byName(E.cur)];if(!q)return;const n=$('pe-n').value.trim();if(n&&n!==q[1]){q[1]=n;q[9]=''}q[0]=$('pe-l').value;q[2]=$('pe-he').value.trim();q[3]=$('pe-d').value.trim();q[4]=$('pe-a').value.trim();q[7]=$('pe-u').value.trim();if(!state.on.has(q[0])){state.on.add(q[0]);groups[q[0]].addTo(map)}map.closePopup();refresh();E.save()};
E.toRoute=function(){const d=DAYS.find(x=>x.id===state.day);if(!d)return;const i=d.stops.indexOf(E.cur);if(i>=0)d.stops.splice(i,1);else d.stops.push(E.cur);map.closePopup();renderList();drawRoute(false);E.save()};
E.del=function(){const i=byName(E.cur);if(i<0||!confirm('למחוק את "'+P[i][2]+'"?'))return;const id=E.cur;P.splice(i,1);DAYS.forEach(d=>{d.stops=d.stops.filter(s=>s!==id)});map.closePopup();refresh();E.save()};
E.dayEditor=function(d,el){el.innerHTML='<div class="de"><label>כותרת<input id="de-t" value="'+esc(d.title)+'"></label><div style="font-weight:600">תיאור</div><div id="de-i" class="de-i" contenteditable="true" dir="rtl"></div><label class="refrow" style="display:flex"><input type="checkbox" id="de-h"'+(d.fromHotel?' checked':'')+'>המסלול יוצא מהמלון</label><div class="pe-b"><button id="de-s">שמירה</button></div><div class="pe-h">סדר התחנות: חצים והסרה ברשימה למטה. הוספת תחנה: לחיצה על נקודה במפה.</div></div>';$('de-i').innerHTML=d.info;$('de-s').onclick=()=>{d.title=$('de-t').value.trim();d.info=$('de-i').innerHTML;d.fromHotel=$('de-h').checked;drawRoute(false);E.save()}};
E.stopCtl=function(it,d,k){const a=it.querySelector('.ar');a.className='stopctl';a.innerHTML='<button title="למעלה">↑</button><button title="למטה">↓</button><button title="הסרה מהמסלול">✕</button>';const b=a.querySelectorAll('button');const s=d.stops;const id=s.filter(x=>byName(x)>=0)[k];const mv=f=>e=>{e.stopPropagation();const j=s.indexOf(id);f(j);renderList();drawRoute(false);E.save()};b[0].onclick=mv(j=>{if(j>0)[s[j-1],s[j]]=[s[j],s[j-1]]});b[1].onclick=mv(j=>{if(j<s.length-1)[s[j+1],s[j]]=[s[j],s[j+1]]});b[2].onclick=mv(j=>s.splice(j,1))};
E.refresh=refresh;
return E})();
fetch('/api/data',{cache:'no-store'}).then(r=>r.status===200?r.json():null).then(j=>{if(j&&Array.isArray(j.points)&&Array.isArray(j.days)){P.length=0;j.points.forEach(p=>P.push(p));DAYS.length=0;j.days.forEach(d=>DAYS.push(d));if(j.trip)Object.assign(TRIP,j.trip);ED.refresh()}}).catch(()=>{});
</script>
</body>
</html>
